<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}AI Song Translator{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <h1><a href="{{ url_for('index') }}">AI Songs Translator</a></h1>
        <p class="tagline">Context-aware translations with cultural notes powered by GPT.</p>
      </div>
    </header>
    <main class="container">
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer container">
      <p>Bring your own <code>OPENAI_API_KEY</code> to enable live GPT translations.</p>
    </footer>
    {% block scripts %}{% endblock %}
  </body>
</html>
